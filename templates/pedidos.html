<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - ReSport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .wordmark-re   { color: #2563EB; }
        .wordmark-sport { color: #2563EB; }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col">

    <header class="border-b border-gray-100 px-6 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/" class="text-xl font-black tracking-tight">
                <span class="wordmark-re">Re</span><span class="wordmark-sport">Sport</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/catalogo" class="text-sm text-gray-400 hover:text-gray-700 transition">Catálogo</a>
                <a href="/carrito-view" class="text-sm text-blue-600 font-semibold hover:underline">🛒 Carrito</a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-6 py-10 w-full">
        <div class="mb-8">
            <p class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Mi cuenta</p>
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">Mis pedidos</h1>
        </div>

        <div id="loading" class="text-gray-400 text-sm py-10 text-center">Cargando pedidos...</div>
        <div id="sin-sesion" class="hidden text-center py-16">
            <p class="text-gray-500 mb-4">Debes iniciar sesión para ver tus pedidos.</p>
            <a href="/login" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition">Iniciar sesión</a>
        </div>
        <div id="vacio" class="hidden text-center py-16">
            <p class="text-5xl mb-4">📦</p>
            <p class="text-gray-500 mb-4">Aún no tienes pedidos.</p>
            <a href="/catalogo" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition">Ver catálogo</a>
        </div>
        <div id="lista-pedidos" class="hidden space-y-4"></div>
    </main>

    <script>
        const token = localStorage.getItem('token');

        const estadoColor = {
            pendiente:  'bg-yellow-100 text-yellow-700',
            pagado:     'bg-blue-100 text-blue-700',
            enviado:    'bg-purple-100 text-purple-700',
            entregado:  'bg-emerald-100 text-emerald-700',
        };

        if (!token) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('sin-sesion').classList.remove('hidden');
        } else {
            cargarPedidos();
        }

        async function cargarPedidos() {
            try {
                const res = await fetch('/pedidos', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('sin-sesion').classList.remove('hidden');
                    return;
                }
                const pedidos = await res.json();
                document.getElementById('loading').classList.add('hidden');

                if (!pedidos || pedidos.length === 0) {
                    document.getElementById('vacio').classList.remove('hidden');
                    return;
                }

                const lista = document.getElementById('lista-pedidos');
                lista.classList.remove('hidden');
                lista.innerHTML = pedidos.map(p => {
                    const estado   = (p.Estado || p.estado || 'pendiente').toLowerCase();
                    const color    = estadoColor[estado] || 'bg-gray-100 text-gray-600';
                    const total    = p.Total || p.total || 0;
                    const metodo   = p.MetodoPago || p.metodo_pago || '—';
                    const items    = p.Items || p.items || [];
                    const fecha    = p.CreatedAt ? new Date(p.CreatedAt).toLocaleDateString('es-EC', { day:'2-digit', month:'short', year:'numeric' }) : '—';
                    return `
                    <div class="border border-gray-100 rounded-2xl p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <p class="font-black text-gray-900">Pedido #${p.ID || p.id}</p>
                                <p class="text-xs text-gray-400 mt-0.5">${fecha} · ${metodo}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-lg font-black text-gray-900">$${Number(total).toFixed(2)}</span>
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full uppercase ${color}">${estado}</span>
                            </div>
                        </div>
                        ${items.length > 0 ? `
                        <div class="border-t border-gray-100 pt-4 space-y-1">
                            ${items.map(item => {
                                const nombre   = item.producto?.Nombre || item.Producto?.Nombre || item.nombre || 'Producto';
                                const precio   = item.PrecioUnitario || item.precio_unitario || 0;
                                const cantidad = item.Cantidad || item.cantidad || 1;
                                return `<div class="flex justify-between text-sm text-gray-600">
                                    <span>${nombre} ×${cantidad}</span>
                                    <span class="font-semibold">$${(precio * cantidad).toFixed(2)}</span>
                                </div>`;
                            }).join('')}
                        </div>` : ''}
                    </div>`;
                }).join('');

            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('lista-pedidos').innerHTML = '<p class="text-red-500 text-sm">Error al cargar pedidos.</p>';
                document.getElementById('lista-pedidos').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
