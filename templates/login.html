<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReSport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .wordmark-re   { color: #2563EB; }
        .wordmark-sport { color: #2563EB; }
        input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col">

    <header class="border-b border-gray-100 px-6 py-4">
        <div class="max-w-md mx-auto">
            <a href="/" class="text-xl font-black tracking-tight">
                <span class="wordmark-re">Re</span><span class="wordmark-sport">Sport</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">

            <div class="mb-8">
                <p class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3">Mi cuenta</p>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight">Iniciar sesión</h1>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-gray-900 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Contraseña</label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-gray-900 transition">
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 rounded-xl transition text-sm tracking-wide">
                    Entrar
                </button>
            </form>

            <div id="mensaje" class="mt-5 p-4 rounded-xl text-sm hidden"></div>

            <div class="mt-8 text-center space-y-2">
                <p class="text-sm text-gray-500">
                    ¿No tienes cuenta?
                    <a href="/registro" class="text-emerald-600 font-semibold hover:underline">Regístrate</a>
                </p>
                <a href="/" class="block text-sm text-gray-400 hover:text-gray-600 transition">← Volver al inicio</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    mensaje.className = 'mt-5 p-4 rounded-xl text-sm bg-emerald-50 border border-emerald-200 text-emerald-800';
                    mensaje.innerHTML = `<p class="font-semibold">✓ Login exitoso — redirigiendo...</p>`;
                    mensaje.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/catalogo', 900);
                } else {
                    mensaje.className = 'mt-5 p-4 rounded-xl text-sm bg-red-50 border border-red-200 text-red-700';
                    mensaje.textContent = '✗ ' + (data.error || 'Error desconocido');
                }
                mensaje.classList.remove('hidden');
            } catch (err) {
                mensaje.className = 'mt-5 p-4 rounded-xl text-sm bg-red-50 border border-red-200 text-red-700';
                mensaje.textContent = '✗ Error de conexión';
                mensaje.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
